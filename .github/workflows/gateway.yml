# CI for the shared LLM-gateway-caller client (src/lib/agent/provider/gateway.ts).
#
# The Go gateway service (services/gateway) this workflow used to build and
# integration-test was decommissioned as part of the new-api integration
# (docs/superpowers/specs/2026-08-11-reizo-new-api-integration-design.md):
# stopped in production and its source deleted. gateway.ts survives — it's a
# plain OpenAI-compatible streaming client, now pointed at new-api instead of
# the old gateway — so this workflow keeps the one job that still tests real,
# load-bearing code.
name: Gateway Caller Contract CI

on:
  push:
    branches: [master]
    paths:
      - "src/lib/agent/provider/gateway.ts"
      - "src/lib/agent/provider/gateway.test.ts"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "src/lib/agent/provider/gateway.ts"
      - "src/lib/agent/provider/gateway.test.ts"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contract:
    name: Next.js gateway caller contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run gateway caller contract tests
        run: npm test -- src/lib/agent/provider/gateway.test.ts
